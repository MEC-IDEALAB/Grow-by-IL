name: Grow CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: grow-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Architecture phase guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test and run architecture guard
        env:
          ARCHITECTURE_PR_BASE: ${{ github.event.pull_request.base.sha }}
          ARCHITECTURE_PUSH_BEFORE: ${{ github.event.before }}
        run: |
          python3 -m unittest discover -s .github/ci -p 'test_*.py'
          python3 .github/ci/architecture_phase_guard.py

  quality:
    name: Flutter quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.9'
          channel: stable

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Dart source
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: flutter test --no-pub
